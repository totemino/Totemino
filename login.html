<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
      (function() {
        const saved = localStorage.getItem('totemino_theme');
        const theme = saved || 
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        window.addEventListener('pageshow', function(event) {
          if (event.persisted || performance.getEntriesByType('navigation')[0]?.type === 'back_forward') {
            location.reload();
          }
        });
      })();
    </script>
    <title>Accesso Sicuro - Totemino</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="stylesheet" href="menu-styles.css"/>
    <link rel="stylesheet" href="login-styles.css"/>
    
</head>
<body>
    <div class="bg-light light1"></div>
    <div class="bg-light light2"></div>
    <div class="bg-light light3"></div>

    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <img class="theme-img" data-light="img/logo/1_light.png" data-dark="img/logo/1_dark.png" alt="Totemino Logo" id="logoSwap">
                <a href="index.html"><h1>Totemino</h1></a>
            </div>
            <div class="nav-actions">
                <button id="theme" class="nav-btn theme-btn" type="button">
                    <img class="theme-img" data-light="img/theme_light.png" data-dark="img/theme_dark.png" alt="Tema">
                </button>
            </div>
        </div>
    </nav>

    <!-- Nuovo wrapper per il testo -->
    <div class="login-text-wrapper">
        <h2 class="login-title">Bentornato al tuo Totemino.</h2>
        <p class="login-subtitle">Crea il tuo menu, ricevi ordini dal tavolo e monitora il tuo locale… in un'unica piattaforma!</p>
    </div>

    <section class="login-section">
        <div class="login-container">
            <!-- Toggle separato -->
            <div class="login-toggle-container">
                <div class="login-toggle" id="loginTabs">
                    <button class="login-toggle-btn active" data-tab="login">Accedi</button>
                    <button class="login-toggle-btn" data-tab="register">Richiedi info</button>
                </div>
            </div>

            <!-- Card principale -->
            <div class="login-card">
                <div id="message-container"></div>

                <!-- SEZIONE LOGIN -->
                <div id="login-section" class="form-section active">
                    <form id="loginForm" autocomplete="off">
                        <div class="form-group">
                            <label for="loginUserCode">ID Utente (4 cifre)</label>
                            <input 
                                type="text" 
                                id="loginUserCode" 
                                placeholder="0000" 
                                maxlength="4" 
                                pattern="[0-9]{4}" 
                                autocomplete="username"
                                required>
                        </div>
                        
                        <div class="form-group">
                            <label for="loginPassword">Password</label>
                            <div class="password-input">
                                <input 
                                    type="password" 
                                    id="loginPassword" 
                                    placeholder="Inserisci password" 
                                    autocomplete="current-password"
                                    required>
                                <button type="button" class="password-toggle" data-target="loginPassword">
                                    <div class="eye-icon">
                                        <svg viewBox="0 0 24 24">
                                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                            <circle cx="12" cy="12" r="3"/>
                                            <line class="eye-slash" x1="1" y1="1" x2="23" y2="23"/>
                                        </svg>
                                    </div>
                                </button>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn btn-solid" id="loginBtn">
                            Accedi
                        </button>
                    </form>
                </div>

                <!-- SEZIONE RICHIESTA INFORMAZIONI -->
                <div id="register-section" class="form-section">
                    <form id="infoForm" autocomplete="off" novalidate>
                        <p class="form-intro">Raccontaci qualcosa del tuo locale: ti ricontatteremo con tutte le informazioni su Totemino.</p>

                        <div class="form-group">
                            <label for="restaurantName">Nome del locale *</label>
                            <input type="text" id="restaurantName" name="restaurantName" placeholder="Es. Trattoria da Mario" maxlength="80" required>
                        </div>

                        <div class="form-group">
                            <label for="contactName">Il tuo nome *</label>
                            <input type="text" id="contactName" name="contactName" placeholder="Nome e cognome" maxlength="80" required>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="contactEmail">Email *</label>
                                <input type="email" id="contactEmail" name="contactEmail" placeholder="nome@email.it" maxlength="120" required>
                            </div>
                            <div class="form-group">
                                <label for="contactPhone">Telefono</label>
                                <input type="tel" id="contactPhone" name="contactPhone" placeholder="Opzionale" maxlength="20">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="city">Città</label>
                            <input type="text" id="city" name="city" placeholder="Dove si trova il locale?" maxlength="60">
                        </div>

                        <div class="form-group">
                            <label for="venueType">Tipo di locale *</label>
                            <select id="venueType" name="venueType" required>
                                <option value="" selected disabled>Seleziona</option>
                                <option value="ristorante">Ristorante</option>
                                <option value="pizzeria">Pizzeria</option>
                                <option value="bar">Bar / Caffetteria</option>
                                <option value="pub">Pub / Birreria</option>
                                <option value="lido">Lido / Stabilimento</option>
                                <option value="altro">Altro</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Quanti tavoli ha il tuo locale? *</label>
                            <div class="choice-group">
                                <label class="choice"><input type="radio" name="tables" value="1-10"><span>1-10</span></label>
                                <label class="choice"><input type="radio" name="tables" value="11-25"><span>11-25</span></label>
                                <label class="choice"><input type="radio" name="tables" value="26-50"><span>26-50</span></label>
                                <label class="choice"><input type="radio" name="tables" value="50+"><span>Più di 50</span></label>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Cosa ti interessa di più?</label>
                            <div class="choice-group">
                                <label class="choice"><input type="checkbox" name="interests" value="menu-digitale"><span>Menu digitale</span></label>
                                <label class="choice"><input type="checkbox" name="interests" value="ordini-tavolo"><span>Ordini dal tavolo</span></label>
                                <label class="choice"><input type="checkbox" name="interests" value="statistiche"><span>Statistiche</span></label>
                                <label class="choice"><input type="checkbox" name="interests" value="multilingua"><span>Menu multilingua</span></label>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="currentSystem">Come gestisci oggi gli ordini?</label>
                            <select id="currentSystem" name="currentSystem">
                                <option value="" selected disabled>Seleziona</option>
                                <option value="carta">Menu cartaceo e comande a voce</option>
                                <option value="qr">Menu QR / digitale</option>
                                <option value="gestionale">Gestionale / cassa con comande</option>
                                <option value="altro">Altro</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="notes">Vuoi aggiungere altro?</label>
                            <textarea id="notes" name="notes" rows="3" maxlength="500" placeholder="Domande, esigenze particolari…"></textarea>
                        </div>

                        <label class="choice consent">
                            <input type="checkbox" id="privacyConsent" name="privacyConsent" required>
                            <span>Acconsento al trattamento dei dati per essere ricontattato. *</span>
                        </label>

                        <button type="submit" class="btn btn-solid" id="infoBtn">
                            Invia richiesta
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- Scripts -->
    <script src="theme.js"></script>
  <script src="logo-pop.js"></script>
    <script src="login-script.js"></script>
</body>

</html>
