<!DOCTYPE html>
<html lang="it" class="view-only">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<script>
		(function() {
			const saved = localStorage.getItem('totemino_theme');
			const theme = saved || 
			(window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
			document.documentElement.setAttribute('data-theme', theme);

			// Dispositivi poco potenti: niente animazioni di sfondo / blur
			try {
				const mem = navigator.deviceMemory, cores = navigator.hardwareConcurrency;
				if ((mem && mem <= 2) || (cores && cores <= 4) ||
					window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
					document.documentElement.classList.add('low-perf');
				}
			} catch (e) {}

			try {
				const urlParams = new URLSearchParams(window.location.search);
				const restaurantId = urlParams.get('id') || (location.pathname.match(/^\/(\d+)\/?$/) || [])[1];
				
				if (!restaurantId) return;
				
				let history = [];
				
				try {
				const stored = localStorage.getItem('totemino_history');
				if (stored) {
					const parsed = JSON.parse(stored);
					if (Array.isArray(parsed)) {
					history = parsed;
					}
				}
				} catch (e) {
				    history = [];
				}
				
				history = history.filter(id => id !== restaurantId);
				history.unshift(restaurantId);
				
				if (history.length > 5) {
				    history = history.slice(0, 5);
				}
				
				localStorage.setItem('totemino_history', JSON.stringify(history));
				
			} catch (error) {
				console.error('Errore salvataggio history:', error);
			}
		})();
	</script>

	<title>Menu - Totemino</title>
	<link rel="icon" type="image/png" href="img/favicon.png">
	<link rel="stylesheet" href="menu-styles.css"/>
	<link rel="stylesheet" href="menu-customization-styles.css"/>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

	<style>
		html.view-only .order,
		html.view-only .cart,
		html.view-only .next,
		html.view-only .cart-popup {
			display: none !important;
		}
	</style>
</head>
  <body>
	<div class="bg-light light1"></div>
	<div class="bg-light light2"></div>
	<div class="bg-light light3"></div>
	<div class="title">
		<div>
			<img id="logoSwap" class="theme-img" data-light="img/logo/1_light.png" data-dark="img/logo/1_dark.png" alt="Logo">
			<a href="index.html"><h1>Totemino</h1></a>
		</div>
		<button id="menu-toggle" class="header-btn menu-toggle-btn" type="button" aria-label="Apri il menu" aria-expanded="false" aria-controls="side-menu">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
		</button>
	</div>
	<div id="side-menu-overlay" class="side-menu-overlay"></div>
	<aside id="side-menu" class="side-menu" aria-hidden="true" aria-label="Menu">
		<div class="side-menu-head">
			<h2>Menu</h2>
			<button class="side-menu-close" type="button" aria-label="Chiudi il menu"><img src="img/x.png" alt=""></button>
		</div>

		<section class="side-group">
			<h3>Visualizzazione</h3>
			<div class="side-segmented" role="group" aria-label="Metodo di visualizzazione">
				<button type="button" data-view="grid" aria-pressed="true"><i class="fa-solid fa-table-cells-large"></i><span>Griglia</span></button>
				<button type="button" data-view="list" aria-pressed="false"><i class="fa-solid fa-list"></i><span>Dettagli</span></button>
			</div>
		</section>

		<section class="side-group">
			<button id="theme" class="side-item" type="button">
				<img class="theme-img" data-light="img/theme_light.png" data-dark="img/theme_dark.png" alt="">
				<span>Tema</span>
				<span id="theme-value" class="side-item-value"></span>
			</button>
			<button id="language-btn" class="side-item" type="button">
				<span class="side-icon"><i class="fa-solid fa-language"></i></span>
				<span>Lingua</span>
			</button>
		</section>
	</aside>

	<div class="categories-row">
		<nav class="categories"></nav>
		<div class="search-box">
			<i class="fa-solid fa-magnifying-glass"></i>
			<input id="search-input" type="search" placeholder="Cerca nel menu" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
		</div>
		<button id="search-btn" class="search-btn" type="button" aria-label="Cerca" aria-expanded="false">
			<i class="fa-solid fa-magnifying-glass"></i>
		</button>
	</div>
	<div class="items"></div>
	<div class="order">	
		<div>
			<div class="cart">
				<img src="img/cart_closed.png" alt="carrello">
				<h3>0</h3>
			</div>
			<div class="text-wrapper">
				<h2>Il tuo ordine</h2>
				<h2 class="price">€0.00</h2>
			</div>
		</div>
		<button class="next">Avanti</button>
	</div>
	<div class="cart-popup hidden"></div>

	<div id="allergen-popup" class="hidden"></div>
	<div class="popup hidden">
		<div class="popup-content">
		<button class="close-popup"><img src="img/x.png"></button>
		<img class="popup-img" src="" alt="Prodotto">
		<h2 class="popup-title"></h2>
		<p class="popup-ingredients"></p>
		<div class="popup-controls"></div>
		<p id="titolo-allergeni">- Allergeni -</p>
		<div class="popup-allergens"></div>
		</div>
	</div>
  </body>
	
	<script src="add-banners.js"></script>
	<script src="menu-script.js"></script>
	<script src="theme.js"></script>
    <script src="logo-pop.js"></script>
</html>
