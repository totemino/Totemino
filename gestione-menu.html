<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      const saved = localStorage.getItem('totemino_theme');
      document.documentElement.setAttribute('data-theme', saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
    })();
    addEventListener('pageshow', e => {
      if (e.persisted || performance.getEntriesByType('navigation')[0]?.type === 'back_forward') location.reload();
    });
  </script>
  <title>Modifica Menu - Totemino</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="stylesheet" href="gestione-menu-styles.css">
  <link rel="stylesheet" href="customization-styles.css">
</head>

<body>
  <div class="bg-light light1"></div>
  <div class="bg-light light2"></div>
  <div class="bg-light light3"></div>

  <!-- HEADER -->
  <div class="title">
    <div class="logo_space">
      <img class="theme-img" data-light="img/logo/1_light.png" data-dark="img/logo/1_dark.png" alt="Logo" id="logoSwap">
      <p>Gestione menù</p>
    </div>
    <div>
      <button id="back-btn" class="header-btn" type="button" data-act="back">
        <img class="theme-img" data-light="img/exit_light.png" data-dark="img/exit_dark.png" alt="Torna a Gestione">
      </button>
      <button id="theme" class="header-btn" type="button">
        <img class="theme-img" data-light="img/theme_light.png" data-dark="img/theme_dark.png" alt="Cambia tema">
      </button>
    </div>
  </div>

  <main class="mg">
    <!-- TIPI DI MENU -->
    <details class="types" open>
      <summary>Tipi di menu <span class="count" id="types-count"></span></summary>
      <div class="chips" id="menu-types-cards"></div>
    </details>

    <!-- TOOLBAR -->
    <div class="toolbar">
      <div class="tb-row">
        <label class="search">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="Cerca un elemento…" autocomplete="off">
        </label>
        <select id="menu-type-filter" class="dropdown" title="Filtra per tipo di menu"></select>
      </div>
      <div class="tb-row">
        <div class="seg">
          <button class="icon-btn" id="view-grid" data-act="view" data-v="grid" title="Griglia"></button>
          <button class="icon-btn" id="view-list" data-act="view" data-v="list" title="Lista compatta"></button>
        </div>
        <button class="btn-secondary btn-sm" id="toggle-all" data-act="toggle-all"></button>
        <button class="btn-primary btn-sm" data-act="add-cat">+ Categoria</button>
      </div>
    </div>
    <p class="stats" id="stats"></p>

    <div class="menu-sections" id="menu-sections"></div>
  </main>

  <!-- BARRA SALVATAGGIO -->
  <div class="savebar" id="savebar">
    <span class="dot"></span><span>Modifiche non salvate</span>
    <button class="btn-secondary btn-sm" data-act="discard">Scarta</button>
    <button class="btn-save btn-sm" id="save-menu" data-act="save-menu">Salva menu</button>
  </div>

  <div class="ctx hidden" id="ctx"></div>
  <div class="notification" id="save-notification"></div>

  <!-- POPUP ELEMENTO -->
  <div class="popup hidden" id="edit-popup">
    <div class="popup-content management-popup">
      <button class="close-popup" data-act="close" data-p="edit-popup"><img src="img/x.png" alt="Chiudi"></button>
      <h2 class="popup-title" id="popup-title"></h2>

      <div class="pop-body">
        <div class="main-form-section">
          <div class="image-section">
            <div class="image-upload-area" id="product-image-area">
              <img id="product-preview" class="image-preview hidden" alt="Anteprima">
              <div class="upload-placeholder" id="product-placeholder">
                <img src="img/upload.png" alt=""><span>Immagine</span>
              </div>
              <input type="file" id="product-image" accept="image/*" class="hidden">
            </div>
            <button type="button" class="link-btn hidden" id="remove-image" data-act="remove-image">Rimuovi</button>
          </div>
          <div class="text-inputs">
            <div class="form-field">
              <label for="item-name">Nome prodotto</label>
              <input type="text" id="item-name" placeholder="Es. Pizza Margherita">
            </div>
            <div class="form-field">
              <label for="item-price">Prezzo (€)</label>
              <input type="number" id="item-price" step="0.10" inputmode="decimal" placeholder="Es. 6.90">
            </div>
          </div>
        </div>

        <div class="form-field">
          <label for="item-description">Descrizione (opzionale)</label>
          <textarea id="item-description" placeholder="Ingredienti separati da virgola (Es. Pomodoro, mozzarella, basilico)"></textarea>
        </div>

        <div class="checkbox-section">
          <label class="checkbox-label"><input type="checkbox" id="item-new"><span class="checkmark"></span><span class="checkbox-text">Segna come "Novità"</span></label>
        </div>

        <div class="customization-field">
          <div class="customization-header">
            <label class="checkbox-label">
              <input type="checkbox" id="item-customizable" onchange="updateCustomizationVisibility()">
              <span class="checkmark"></span><span class="checkbox-text">Prodotto Modificabile</span>
            </label>
          </div>
          <div class="customization-controls" id="customization-controls" style="display:none;">
            <input type="hidden" id="customization-group-id" />
            <button type="button" class="btn-group-id-display" id="btn-group-id-display" onclick="openCurrentGroupOrSelection()">-</button>
            <button type="button" class="btn-secondary btn-sm btn-choose-group" onclick="openGroupSelectionPopup()">Scegli Gruppo</button>
            <button type="button" class="btn-primary btn-sm btn-add-group" onclick="createNewGroup()">+ Aggiungi Gruppo</button>
          </div>
        </div>

        <p class="lbl">Allergeni</p>
        <div class="allergens-grid" id="allergens-grid"></div>
      </div>

      <div class="popup-actions">
        <button class="btn-danger hidden" id="delete-item" data-act="item-delete">Elimina</button>
        <button class="btn-secondary" data-act="close" data-p="edit-popup">Annulla</button>
        <button class="btn-primary" id="save-item" data-act="item-save">Salva</button>
      </div>
    </div>
  </div>

  <!-- POPUP TIPO MENU (nuovo / modifica) -->
  <div class="popup hidden" id="type-popup">
    <div class="popup-content management-popup narrow">
      <button class="close-popup" data-act="close" data-p="type-popup"><img src="img/x.png" alt="Chiudi"></button>
      <h2 class="popup-title" id="type-title"></h2>

      <div class="pop-body">
        <div class="icon-row">
          <div class="icon-pick">
            <div class="icon-box"><img id="type-icon" src="img/menu_icons/1.png" alt="Icona"></div>
            <div class="icon-arrows">
              <button class="reorder-btn" type="button" data-act="type-icon" data-d="prev" title="Precedente"><img src="img/arrow-up.png" alt="Su"></button>
              <button class="reorder-btn" type="button" data-act="type-icon" data-d="next" title="Successiva"><img src="img/arrow-down.png" alt="Giù"></button>
            </div>
          </div>
          <div class="icon-fields">
            <div class="form-field"><label for="type-name">Nome visualizzato</label><input type="text" id="type-name" placeholder="Es. Menu Bar"></div>
            <div class="form-field" id="type-coperto-form"><label for="type-coperto">Prezzo coperto (€)</label><input type="number" id="type-coperto" step="0.01" min="0" value="0.00"></div>
          </div>
        </div>

        <label class="checkbox-label" style="margin-top:14px">
          <input type="checkbox" id="type-visible"><span class="checkmark"></span><span class="checkbox-text">Menu visibile pubblicamente</span>
        </label>
      </div>

      <div class="popup-actions">
        <button class="btn-danger" id="type-delete" data-act="type-delete">Elimina</button>
        <button class="btn-secondary" data-act="close" data-p="type-popup">Annulla</button>
        <button class="btn-primary" data-act="type-save">Salva</button>
      </div>
    </div>
  </div>

  <!-- POPUP CATEGORIA (nuova / modifica) -->
  <div class="popup hidden" id="edit-category-popup">
    <div class="popup-content management-popup narrow">
      <button class="close-popup" data-act="close" data-p="edit-category-popup"><img src="img/x.png" alt="Chiudi"></button>
      <h2 class="popup-title" id="cat-title"></h2>

      <div class="pop-body">
        <div class="form-field">
          <label for="cat-name">Nome categoria</label>
          <input type="text" id="cat-name" placeholder="Nome della categoria">
        </div>

        <div id="cat-extra">
          <p class="lbl">Questa categoria appare in</p>
          <div id="category-menu-types" class="chk-grid"></div>
          <p class="lbl" style="margin-top:16px">Riordina elementi <span class="hint">(trascina o usa le frecce)</span></p>
          <div id="draggable-items-list"></div>
        </div>
      </div>

      <div class="popup-actions">
        <button class="btn-secondary" data-act="close" data-p="edit-category-popup">Annulla</button>
        <button class="btn-primary" data-act="cat-save">Salva</button>
      </div>
    </div>
  </div>

  <!-- POPUP SELEZIONE GRUPPO -->
  <div class="popup hidden" id="group-selection-popup">
    <div class="popup-content management-popup narrow">
      <button class="close-popup" onclick="closeGroupSelectionPopup()"><img src="img/x.png" alt="Chiudi"></button>
      <h2 class="popup-title">Seleziona gruppo</h2>
      <div class="pop-body"><div id="groups-list"></div></div>
      <div class="popup-actions">
        <button class="btn-save btn-create-new-group" onclick="createNewGroup()">+ Crea nuovo gruppo</button>
      </div>
    </div>
  </div>

  <!-- POPUP GESTIONE CUSTOMIZZAZIONE -->
  <div class="popup hidden" id="customization-popup">
    <div class="popup-content management-popup">
      <button class="close-popup" onclick="closeCustomizationGroupPopup()"><img src="img/x.png" alt="Chiudi"></button>
      <h2 class="popup-title" id="customization-popup-title">Crea nuovo gruppo</h2>
      <div class="pop-body">
        <div id="customization-sections-container"></div>
        <button class="btn-primary add-section-btn" onclick="addCustomizationSection()">+ Aggiungi nuova sezione</button>
      </div>
      <div class="popup-actions">
        <button class="btn-secondary" onclick="closeCustomizationGroupPopup()">Annulla</button>
        <button class="btn-save" onclick="saveCustomizationGroup()">Salva gruppo</button>
      </div>
    </div>
  </div>

  <!-- CONFERMA -->
  <div class="popup hidden" id="confirm-popup">
    <div class="confirm-box">
      <h3 id="confirm-title"></h3>
      <p id="confirm-text"></p>
      <div class="popup-actions">
        <button class="btn-secondary" id="confirm-cancel">Annulla</button>
        <button class="btn-danger" id="confirm-ok">Elimina</button>
      </div>
    </div>
  </div>

  <script src="auth-protection.js"></script>
  <script src="theme.js"></script>
  <script src="logo-pop.js"></script>
  <script src="gestione-menu-script.js"></script>
  <script src="customization-manager.js"></script>
</body>
</html>
