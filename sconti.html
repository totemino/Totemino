<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
      (function() {
        const saved = localStorage.getItem('totemino_theme');
        document.documentElement.setAttribute('data-theme', saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
      })();
    </script>
    <title>Sconti per te - Totemino</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="stylesheet" href="gestionale-styles.css"/>
</head>
<body>
    <div class="bg-light light1"></div>
    <div class="bg-light light2"></div>
    <div class="bg-light light3"></div>

    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <img class="theme-img" data-light="img/logo/1_light.png" data-dark="img/logo/1_dark.png" alt="Totemino Logo" id="logoSwap">
                <a href="index.html"><h1>Totemino</h1></a>
            </div>
            <div class="nav-actions">
                <button id="theme" class="nav-btn theme-btn" type="button">
                    <img class="theme-img" data-light="img/theme_light.png" data-dark="img/theme_dark.png" alt="Tema">
                </button>
            </div>
        </div>
    </nav>

    <main class="mg gx-narrow">
        <h2 class="gx-title">Il tuo piano</h2>
        <section class="gx-card gx-plan" id="plan"></section>

        <h2 class="gx-title">Sconti per te</h2>
        <section class="gx-card gx-overview">
            <div class="gx-ring">
                <svg viewBox="0 0 120 120" aria-hidden="true">
                    <circle class="bg" cx="60" cy="60" r="52"/>
                    <circle class="fg" id="ringFg" cx="60" cy="60" r="52" stroke-dasharray="0 326.7"/>
                </svg>
                <b id="pct">0%</b>
            </div>
            <div class="gx-months" id="months">Nessuno sconto per ora</div>
            <p class="muted" id="discountNote"></p>
        </section>

        <div class="gx-head-row">
            <h2 class="gx-title">Referenze</h2>
            <button class="btn-primary" id="addBtn" type="button">+ Aggiungi referenze</button>
        </div>
        <p class="muted">Ogni contatto che diventa cliente vale il 25% di sconto sulla tua prossima fattura.</p>
        <div class="gx-list" id="refList"></div>
    </main>

    <!-- Aggiungi referenze -->
    <div class="gx-overlay" id="addModal">
        <div class="gx-modal">
            <h3>Aggiungi referenze</h3>
            <div class="pop-body">
                <button class="btn-secondary hidden" id="pickBtn" type="button">Scegli dalla rubrica</button>
                <div class="gx-row" style="margin-top:12px">
                    <div class="form-field">
                        <label for="cName">Nome</label>
                        <input type="text" id="cName" maxlength="60" placeholder="Es. Mario Rossi" autocomplete="off">
                    </div>
                    <div class="form-field">
                        <label for="cPhone">Telefono</label>
                        <input type="tel" id="cPhone" maxlength="20" placeholder="333 1234567" autocomplete="off">
                    </div>
                </div>
                <button class="btn-secondary btn-sm" id="manualAdd" type="button">+ Aggiungi alla lista</button>
                <div class="gx-stage" id="stage"></div>
            </div>
            <div class="popup-actions">
                <button class="btn-secondary" id="addCancel" type="button">Annulla</button>
                <button class="btn-save" id="sendBtn" type="button" disabled>Invia</button>
            </div>
        </div>
    </div>

    <div class="notification" id="note"></div>

    <script src="auth-protection.js"></script>
    <script src="theme.js"></script>
    <script src="logo-pop.js"></script>
    <script src="sconti-script.js"></script>
</body>
</html>
